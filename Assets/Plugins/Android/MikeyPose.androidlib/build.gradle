// Unity Android Library module: native CameraX + MediaPipe pose plugin (Java — no Kotlin,
// so it builds with Unity's stock Android Gradle without extra plugin setup).

apply plugin: 'com.android.library'

android {
    namespace "com.mikey.pose"
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
    }

    // Unity's .androidlib keeps AndroidManifest.xml at the module root; point AGP at it
    // (its default is src/main/AndroidManifest.xml) so the CAMERA permission actually merges.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Align all Kotlin stdlib artifacts to 1.8.22 so the old kotlin-stdlib-jdk7/jdk8:1.6.21
    // (pulled transitively) resolve to empty redirects instead of duplicating the classes
    // that Kotlin 1.8 merged into the main stdlib — otherwise :checkReleaseDuplicateClasses fails.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'

    // MediaPipe Tasks — on-device pose (BlazePose, 33 landmarks).
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // CameraX
    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax}"
    implementation "androidx.camera:camera-camera2:${camerax}"
    implementation "androidx.camera:camera-lifecycle:${camerax}"

    implementation "androidx.lifecycle:lifecycle-common:2.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime:2.6.2"
    implementation "androidx.annotation:annotation:1.7.1"
}
